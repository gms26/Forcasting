<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Bright, High-Contrast Vibrant Rounded Background -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)" />

  <!-- Bold, High-Visibility Crisp White 'F' -->
  <g filter="url(#glow)">
    <!-- Vertical stem -->
    <rect x="10" y="10" width="7" height="28" rx="3.5" fill="#ffffff" />
    
    <!-- Top horizontal bar -->
    <rect x="10" y="10" width="26" height="7" rx="3.5" fill="#ffffff" />
    
    <!-- Middle horizontal bar -->
    <rect x="10" y="21" width="18" height="6.5" rx="3.25" fill="#ffffff" />
    
    <!-- Predictive dot accent -->
    <circle cx="33" cy="24.25" r="3.5" fill="#ffffff" />
  </g>
</svg>